<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职能沟通翻译助手</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 可按需修改后端 API 地址
        window.API_BASE_URL = 'https://ai-demo-pnm2.vercel.app/api';
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header-title">职能沟通翻译助手</h1>
            <p class="header-subtitle">产品 ↔ 开发 双向翻译 · 场景识别</p>
        </header>

        <main class="main-content">
            <section class="section direction-section">
                <h2 class="section-title">选择翻译方向</h2>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="direction" value="product_to_dev" checked>
                        <div class="radio-text">
                            <strong>产品 → 开发</strong>
                            <span class="radio-desc">将产品需求翻译为技术实现建议</span>
                        </div>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="direction" value="dev_to_product">
                        <div class="radio-text">
                            <strong>开发 → 产品</strong>
                            <span class="radio-desc">将技术方案翻译为业务价值说明</span>
                        </div>
                    </label>
                </div>
            </section>

            <div class="recognition-result" id="recognitionResult" style="display: none;">
                <span class="recognition-icon">⚡</span>
                <span class="recognition-text" id="recognitionText"></span>
                <button class="recognition-switch" id="recognitionSwitch">切换</button>
            </div>

            <section class="section input-section">
                <h2 class="section-title">请输入内容</h2>
                <textarea
                    class="input-textarea"
                    id="inputContent"
                    placeholder="请输入产品需求描述,例如: 我们需要一个智能推荐功能..."
                    maxlength="5000"
                ></textarea>
                <div class="input-footer">
                    <span class="char-count" id="charCount">已输入 0/5000 字</span>
                    <div class="button-group">
                        <button class="btn-secondary" id="clearBtn">清空</button>
                        <button class="btn-primary" id="translateBtn" disabled>开始翻译</button>
                    </div>
                </div>
            </section>

            <section class="section result-section">
                <h2 class="section-title">翻译结果</h2>
                <div class="result-display" id="resultDisplay">
                    <div class="result-empty" id="resultEmpty">翻译结果将在这里实时显示...</div>
                    <div class="result-content" id="resultContent" style="display: none;"></div>
                    <div class="result-loading" id="resultLoading" style="display: none;">
                        <span class="loading-spinner"></span>
                        <span>AI 正在思考...</span>
                    </div>
                </div>
                <div class="result-footer">
                    <button class="btn-secondary" id="copyBtn" disabled>复制结果</button>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
